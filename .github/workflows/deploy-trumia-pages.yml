name: Deploy Trumia demo to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/trumia-swipe-navigation-KKAaO
    paths:
      - 'trumia_demo/**'
      - '.github/workflows/deploy-trumia-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trumia_demo
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href "/free-claude-code/" --pwa-strategy=offline-first

      - uses: actions/upload-pages-artifact@v3
        with:
          path: trumia_demo/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
